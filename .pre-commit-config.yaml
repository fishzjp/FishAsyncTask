repos:
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.9

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
        args: [--html-report, mypy-report]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest --cov=fish_async_task --cov-fail-under=80 -x
        language: system
        pass_filenames: false
        always_run: true

      - id: interrogate
        name: interrogate
        entry: interrogate fish_async_task/ --fail-under=80
        language: system
        pass_filenames: false
        always_run: true
