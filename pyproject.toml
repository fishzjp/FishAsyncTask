[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "fish-async-task"
version = "3.0.1"
description = "高性能异步任务管理器，默认采用Rust核心实现，支持线程池和动态伸缩"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "fishzjp"}
]
keywords = ["async", "task", "manager", "threadpool", "queue"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "typing-extensions>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/fishzjp/FishAsyncTask"
Documentation = "https://fishzjp.github.io/FishAsyncTask/"
Repository = "https://github.com/fishzjp/FishAsyncTask"
Issues = "https://github.com/fishzjp/FishAsyncTask/issues"

[tool.maturin]
module-name = "fish_async_task._core"
features = ["pyo3/extension-module"]
bindings = "pyo3"

[tool.setuptools]
packages = ["fish_async_task"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[project.optional-dependencies]
performance = [
    "psutil>=5.9.0,<7.0.0",
    "redis>=4.5.0,<6.0.0",        # huey 和 dramatiq 需要
    "huey>=2.4.0,<3.0.0",         # 轻量级任务队列
    "dramatiq>=1.14.0,<2.0.0",    # 高性能任务队列
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "locust>=2.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "lxml>=4.9.0",
    "interrogate>=1.5.0"
]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::pytest.PytestReturnNotNoneWarning",
]
markers = [
    "smoke: 冒烟测试，快速验证核心功能",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
# 逐步启用更严格的类型检查
warn_redundant_casts = true
strict_optional = true
# HTML报告生成
html_report = "mypy-report"
show_error_context = true

# 第三方库类型忽略
[[tool.mypy.overrides]]
module = [
    "psutil.*",
    "redis.*",
    "huey.*",
    "dramatiq.*"
]
ignore_missing_imports = true


