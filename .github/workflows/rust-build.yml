name: Rust Extension Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'fish_async_task_core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'fish_async_task_core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-build.yml'

jobs:
  test:
    name: Test Rust Extension
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        python: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # patchelf 只在 Linux 上需要
        if [ "$RUNNER_OS" == "Linux" ]; then
          pip install maturin[patchelf] pytest
        else
          pip install maturin pytest
        fi

    - name: Build Rust extension
      run: |
        maturin develop --release

    - name: Run Python tests
      run: |
        pytest tests/ -v -x --tb=short

  build-wheels:
    name: Build Wheels
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['39', '310', '311', '312']
        target: [x86_64]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install maturin
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # patchelf 只在 Linux 上需要
        if [ "$RUNNER_OS" == "Linux" ]; then
          pip install maturin[patchelf]
        else
          pip install maturin
        fi

    - name: Build wheels
      run: |
        maturin build --release --strip --out dist --interpreter python${{ matrix.python }}

    - name: Test wheel
      shell: bash
      run: |
        pip install dist/*.whl --force-reinstall
        python -c "from fish_async_task import TaskManager; print('OK')"

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.python }}
        path: dist/*.whl

  lint:
    name: Lint Rust Code
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Check formatting
      run: |
        cargo fmt --all -- --check

    - name: Run Clippy
      run: |
        cargo clippy --all-targets --all-features -- -D warnings

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: |
        cargo install cargo-audit

    - name: Run audit
      run: |
        cargo audit
